<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>SLX Network v1.8.1</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#07090f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

body{min-height:100vh}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

.hidden{
  display:none!important
}

.app{
  width:100%;
  max-width:640px;
  margin:auto;
  padding:14px 13px 100px
}

h1{
  font-size:30px;
  margin:14px 0 5px
}

h2{
  font-size:20px;
  margin:0 0 12px
}

h3{
  margin:0 0 7px;
  font-size:15px
}

.muted{
  color:#929bad;
  line-height:1.45
}

.small{
  font-size:12px;
  color:#7e899d
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border:1px solid #30394b;
  border-radius:999px;
  color:#9ee7ff;
  font-size:12px
}

.card{
  background:#101521;
  border:1px solid #202838;
  border-radius:16px;
  padding:14px;
  margin-top:12px
}

input,select{
  width:100%;
  padding:13px 14px;
  margin-top:9px;
  color:#fff;
  background:#0b1019;
  border:1px solid #30394b;
  border-radius:12px;
  outline:none
}

input:focus,select:focus{
  border-color:#66dcff
}

button{
  border:0;
  border-radius:12px;
  padding:12px 14px;
  background:#66dcff;
  color:#061018;
  font-weight:700
}

button.secondary{
  background:#18202e;
  color:#dce7f5;
  border:1px solid #30394b
}

button.danger{
  background:#3a1820;
  color:#ffb7c0;
  border:1px solid #66303b
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.row{
  display:flex;
  gap:8px;
  align-items:center
}

.row>*{
  min-width:0
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.balance{
  font-size:30px;
  font-weight:800;
  margin:5px 0;
  word-break:break-word
}

.slx{
  color:#7de3ff
}

.address{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
  color:#9ba7bb;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.wallet-list{
  display:grid;
  gap:7px;
  margin-top:10px
}

.wallet-item{
  width:100%;
  min-height:54px;
  padding:8px 10px;
  margin:0;
  text-align:left;
  background:#0b1018;
  color:#fff;
  border:1px solid #252e3e;
  border-radius:11px;
  overflow:hidden
}

.wallet-item.active{
  border-color:#66dcff;
  box-shadow:0 0 0 1px #66dcff inset
}

.wallet-line{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center
}

.wallet-name{
  font-weight:700;
  font-size:13px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.wallet-balance{
  color:#7de3ff;
  font-size:13px;
  white-space:nowrap
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px
}

.actions button{
  min-width:0
}

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(7,9,15,.94);
  backdrop-filter:blur(15px);
  border-top:1px solid #202838
}

.nav-inner{
  max-width:640px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:5px
}

.nav button{
  padding:9px 4px;
  background:transparent;
  color:#7f8ba0;
  border:1px solid transparent;
  font-size:11px
}

.nav button.active{
  color:#fff;
  background:#111925;
  border-color:#283244
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.68);
  padding:12px
}

.modal-box{
  width:100%;
  max-width:640px;
  max-height:90vh;
  overflow:auto;
  background:#101521;
  border:1px solid #293447;
  border-radius:18px;
  padding:15px
}

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  max-width:90%;
  padding:10px 14px;
  background:#151d2a;
  border:1px solid #334057;
  border-radius:12px;
  color:#fff;
  font-size:13px;
  box-shadow:0 8px 30px rgba(0,0,0,.35)
}

.list{
  display:grid;
  gap:7px
}

.list-item{
  background:#0b1018;
  border:1px solid #222c3c;
  border-radius:11px;
  padding:10px
}

.stat{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid #202838
}

.stat:last-child{
  border-bottom:0
}

.qr{
  width:220px;
  height:220px;
  margin:12px auto;
  display:block;
  background:#fff;
  padding:8px;
  border-radius:12px
}

.center{
  text-align:center
}

hr{
  border:0;
  border-top:1px solid #202838;
  margin:14px 0
}

.error{
  color:#ff9ca8;
  font-size:13px;
  margin-top:8px
}

.success{
  color:#8ff0b3;
  font-size:13px;
  margin-top:8px
}

@media(max-width:380px){
  .actions{
    grid-template-columns:1fr
  }

  .nav button{
    font-size:10px
  }
}
</style>
</head>

<body>

<div id="app" class="app"></div>

<div id="nav" class="nav hidden">
  <div class="nav-inner">
    <button id="navHome" onclick="showPage('home')">⌂<br><span data-t="home">Главная</span></button>
    <button id="navWallet" onclick="showPage('wallet')">◈<br><span data-t="wallet">Кошелёк</span></button>
    <button id="navHistory" onclick="showPage('history')">↕<br><span data-t="history">История</span></button>
    <button id="navNetwork" onclick="showPage('network')">◎<br><span data-t="network">Сеть</span></button>
    <button id="navSettings" onclick="showPage('settings')">⚙<br><span data-t="settings">Настройки</span></button>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div id="modalBox" class="modal-box"></div>
</div>

<div id="toast" class="toast hidden"></div>

/* =========================
   API
========================= */

async function api(path,options={}){
  const headers={
    "Content-Type":"application/json",
    ...(options.headers||{})
  };

  if(token){
    headers.Authorization="Bearer "+token;
  }

  const response=await fetch(API_BASE+path,{
    ...options,
    headers
  });

  let data=null;

  try{
    data=await response.json();
  }catch{
    data={};
  }

  if(response.status===401){
    token="";
    localStorage.removeItem("slx_token");
    showLogin();
    throw new Error(t("sessionExpired"));
  }

  if(!response.ok){
    throw new Error(
      data.message ||
      data.error ||
      "HTTP "+response.status
    );
  }

  return data;
}

   UI HELPERS

function toast(message){
  const el=document.getElementById("toast");

  el.textContent=message;
  el.classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer=setTimeout(()=>{
    el.classList.add("hidden");
  },2200);
}

function esc(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function shortAddress(address){
  if(!address)return"—";

  const s=String(address);

  if(s.length<=20)return s;

  return s.slice(0,9)+"…"+s.slice(-7);
}

function setTextTranslations(){
  document.querySelectorAll("[data-t]").forEach(el=>{
    el.textContent=t(el.dataset.t);
  });
}

async function login(){
  const username=
    document.getElementById("loginUsername").value.trim();

  const password=
    document.getElementById("loginPassword").value;

  if(!username){
    toast(t("usernameRequired"));
    return;
  }

  if(!password){
    toast(t("passwordRequired"));
    return;
  }

  try{
    const data=await api("/api/auth/login",{
      method:"POST",
      body:JSON.stringify({
        username,
        password
      })
    });

    token=
      data.token ||
      data.accessToken ||
      data.data?.token ||
      "";

    if(token){
      localStorage.setItem("slx_token",token);
    }

    toast(t("ready"));

    await startApp();

  }catch(error){
    toast(error.message||t("networkError"));
  }
}

async function register(){
  const username=
    document.getElementById("regUsername").value.trim();

  const password=
    document.getElementById("regPassword").value;

  const password2=
    document.getElementById("regPassword2").value;

  if(!username){
    toast(t("usernameRequired"));
    return;
  }

  if(password.length<6){
    toast(t("passwordHint"));
    return;
  }

  if(password!==password2){
    toast(t("passwordMismatch"));
    return;
  }

  try{
    const data=await api("/api/auth/register",{
      method:"POST",
      body:JSON.stringify({
        username,
        password
      })
    });

    token=
      data.token ||
      data.accessToken ||
      data.data?.token ||
      "";

    if(token){
      localStorage.setItem("slx_token",token);
      await startApp();
    }else{
      toast(t("ready"));
      showLogin();
    }

  }catch(error){
    toast(error.message||t("networkError"));
  }
}

async function loadWallets(){
  const data=await api("/api/wallets");

  wallets=
    Array.isArray(data)
      ? data
      : (
          data.wallets ||
          data.data ||
          []
        );

  if(!Array.isArray(wallets)){
    wallets=[];
  }

  if(!activeWallet && wallets.length){
    activeWallet=
      wallets[0].id ||
      wallets[0].walletId ||
      wallets[0].address ||
      "";

    localStorage.setItem(
      "slx_active_wallet",
      activeWallet
    );
  }

  currentWallet=
    wallets.find(w=>
      String(
        w.id ||
        w.walletId ||
        w.address ||
        ""
      )===String(activeWallet)
    ) ||
    wallets[0] ||
    null;
}

function walletId(wallet){
  return wallet?.id ||
         wallet?.walletId ||
         wallet?.address ||
         "";
}

function walletAddress(wallet){
  return wallet?.address ||
         wallet?.walletAddress ||
         wallet?.publicKey ||
         "";
}

function walletBalance(wallet){
  return wallet?.balance ??
         wallet?.amount ??
         wallet?.slx ??
         0;
}

async function selectWallet(id){
  try{
    toast(t("walletSwitching"));

    await api("/api/wallet/select",{
      method:"POST",
      body:JSON.stringify({
        walletId:id,
        id
      })
    });

    activeWallet=id;

    localStorage.setItem(
      "slx_active_wallet",
      activeWallet
    );

    await loadWallets();

    toast(t("walletSelected"));

    showPage(currentPage);

  }catch(error){
    toast(error.message||t("networkError"));
  }
}

    toast(t("walletCreated"));

async function confirmSend(){
  const recipient=
    document.getElementById("sendRecipient").value.trim();

  const amount=
    Number(document.getElementById("sendAmount").value);

  if(!recipient || !amount || amount<=0){
    toast(t("sendHint"));
    return;
  }

  openModal(`
    <h2>${esc(t("confirmTransfer"))}</h2>

    <div class="stat">
      <span>${esc(t("recipient"))}</span>
      <strong>${esc(shortAddress(recipient))}</strong>
    </div>

    <div class="stat">
      <span>${esc(t("amount"))}</span>
      <strong>${esc(amount)} SLX</strong>
    </div>

    <div class="stat">
      <span>${esc(t("networkFee"))}</span>
      <strong>—</strong>
    </div>

    <div class="actions">
      <button onclick="sendSLX('${encodeURIComponent(recipient)}',${amount})">
        ${esc(t("confirm"))}
      </button>

      <button class="secondary" onclick="closeModal()">
        ${esc(t("cancel"))}
      </button>
    </div>
  `);
}

async function sendSLX(encodedRecipient,amount){
  const recipient=decodeURIComponent(encodedRecipient);

  try{
    await api("/api/send",{
      method:"POST",
      body:JSON.stringify({
        walletId:activeWallet,
        from:walletAddress(currentWallet),
        to:recipient,
        recipient,
        amount
      })
    });

    closeModal();

    toast(t("transferCompleted"));

    await loadWallets();
    showPage("home");

  }catch(error){
    toast(error.message||t("networkError"));
  }
}

      <div class="stat">
        <span>${esc(t("supply"))}</span>
        <strong>
          ${esc(
            economy?.supply ??
            economy?.currentSupply ??
            "—"
          )}
        </strong>
      </div>

      <div class="stat">
        <span>${esc(t("maxSupply"))}</span>
        <strong>
          ${esc(
            economy?.maxSupply ??
            "—"
          )}
        </strong>
      </div>

      <div class="stat">
        <span>${esc(t("users"))}</span>
        <strong>
          ${esc(
            economy?.users ??
            economy?.userCount ??
            "—"
          )}
        </strong>
      </div>
    </div>
  `;

  updateNav("navNetwork");
}

/* =========================
   SETTINGS
========================= */

function renderSettings(){
  document.getElementById("app").innerHTML=`
    <h1>${esc(t("settings"))}</h1>

    <div class="card">
      <h2>${esc(t("language"))}</h2>

      <p class="muted">
        ${esc(t("settingsDesc"))}
      </p>

      <select
        id="languageSelect"
        onchange="changeLanguage(this.value)"
      >
        ${languageOptions()}
      </select>
    </div>

    <div class="card">
      <h2>${esc(t("security"))}</h2>

      <div class="stat">
        <span>${esc(t("session"))}</span>
        <strong>${esc(t("active"))}</strong>
      </div>

      <div class="stat">
        <span>${esc(t("tokenStorage"))}</span>
        <strong>localStorage</strong>
      </div>

      <div class="small" style="margin-top:8px">
        ${esc(t("securityNote"))}
      </div>

      <button
        style="width:100%;margin-top:12px"
        onclick="openChangePassword()"
      >
        ${esc(t("changePassword"))}
      </button>
    </div>

    <div class="card">
      <button
        class="danger"
        style="width:100%"
        onclick="logout()"
      >
        ${esc(t("logout"))}
      </button>
    </div>
  `;

  updateNav("navSettings");
}

function openChangePassword(){
  openModal(`
    <h2>${esc(t("changePassword"))}</h2>

    <input
      id="oldPassword"
      type="password"
      placeholder="${esc(t("password"))}"
    >

    <input
      id="newPassword"
      type="password"
      placeholder="${esc(t("newPassword"))}"
    >

    <input
      id="newPassword2"
      type="password"
      placeholder="${esc(t("confirmPassword"))}"
    >

    <button
      style="width:100%;margin-top:10px"
      onclick="changePassword()"
    >
      ${esc(t("changePassword"))}
    </button>

    <button
      class="secondary"
      style="width:100%;margin-top:8px"
      onclick="closeModal()"
    >
      ${esc(t("cancel"))}
    </button>
  `);
}

async function changePassword(){
  const oldPassword=
    document.getElementById("oldPassword").value;

  const newPassword=
    document.getElementById("newPassword").value;

  const newPassword2=
    document.getElementById("newPassword2").value;

  if(newPassword!==newPassword2){
    toast(t("passwordMismatch"));
    return;
  }

  if(newPassword.length<6){
    toast(t("passwordHint"));
    return;
  }

  try{
    await api("/api/auth/password/change",{
      method:"POST",
      body:JSON.stringify({
        oldPassword,
        newPassword
      })
    });

    closeModal();
    toast(t("passwordChanged"));

  }catch(error){
    toast(error.message||t("networkError"));
  }
}

/* =========================
   LANGUAGE
========================= */

function languageOptions(){
  return `
    <option value="ru" ${currentLanguage==="ru"?"selected":""}>
      Русский
    </option>

    <option value="en" ${currentLanguage==="en"?"selected":""}>
      English
    </option>

    <option value="ja" ${currentLanguage==="ja"?"selected":""}>
      日本語
    </option>

    <option value="kk" ${currentLanguage==="kk"?"selected":""}>
      Қазақша
    </option>

    <option value="zh" ${currentLanguage==="zh"?"selected":""}>
      简体中文
    </option>
  `;
}

function changeLanguage(language){
  if(!LANG[language]){
    return;
  }

  currentLanguage=language;

  localStorage.setItem(
    "slx_language",
    currentLanguage
  );

  if(token){
    showPage(currentPage==="login"?"home":currentPage);
  }else{
    showLogin();
  }
}

/* =========================
   NAVIGATION
========================= */

function updateNav(id){
  document.querySelectorAll(".nav button")
    .forEach(button=>{
      button.classList.remove("active");
    });

  const el=document.getElementById(id);

  if(el){
    el.classList.add("active");
  }
}

async function showPage(page){
  currentPage=page;

  try{
    if(page==="home"){
      await renderHome();
    }

    else if(page==="wallet"){
      await renderWallet();
    }

    else if(page==="history"){
      await renderHistory();
    }

    else if(page==="network"){
      await renderNetwork();
    }

    else if(page==="settings"){
      renderSettings();
    }

  }catch(error){
    console.error(error);
    toast(error.message||t("networkError"));
  }
}

/* =========================
   MODAL
========================= */

function openModal(html){
  document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
  document.getElementById("modal").classList.add("hidden");
  document.getElementById("modalBox").innerHTML="";
}

/* =========================
   LOGOUT
========================= */

async function logout(){
  try{
    await api("/api/auth/logout",{
      method:"POST"
    });
  }catch{}

  token="";
  activeWallet="";
  wallets=[];
  currentWallet=null;

  localStorage.removeItem("slx_token");
  localStorage.removeItem("slx_active_wallet");

  document.getElementById("nav").classList.add("hidden");

  showLogin();
}

/* =========================
   INIT
========================= */

document
  .getElementById("modal")
  .addEventListener("click",event=>{
    if(event.target.id==="modal"){
      closeModal();
    }
  });

(async function init(){

  if(token){
    try{
      await startApp();
    }catch{
      showLogin();
    }
  }else{
    showLogin();
  }

})();
</script>

</body>
</html>
