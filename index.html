<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLX Network v0.7</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #070912;
      color: white;
    }

    .app {
      max-width: 520px;
      margin: auto;
      padding: 24px 16px 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6737ff, #00cfff);
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .version {
      color: #8d93a7;
      margin-top: 4px;
      font-size: 13px;
    }

    .card {
      background: #101522;
      border: 1px solid #20283a;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .label {
      color: #8d93a7;
      font-size: 14px;
    }

    .balance {
      font-size: 38px;
      font-weight: 800;
      margin-top: 8px;
    }

    .coin {
      color: #9b6cff;
    }

    .wallet {
      margin-top: 16px;
      color: #777f95;
      font-size: 12px;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 16px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      background: #20283a;
    }

    .primary {
      background: linear-gradient(135deg, #6737ff, #287cff);
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid #20283a;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .muted {
      color: #8d93a7;
    }

    .online {
      color: #42e879;
    }

    .tx {
      padding: 13px 0;
      border-bottom: 1px solid #20283a;
    }

    .empty {
      text-align: center;
      color: #777f95;
      padding: 10px;
    }

    footer {
      text-align: center;
      color: #596176;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">S</div>

    <div style="text-align:right">
      <h1>SLX Network</h1>
      <div class="version">Testnet • v0.7</div>
    </div>
  </header>

  <section class="card">
    <div class="label">Ваш баланс</div>
    <div class="balance">
      <span id="balance">...</span>
      <span class="coin">SLX</span>
    </div>

    <div class="wallet">
      Wallet:
      <span id="wallet">...</span>
    </div>
  </section>

  <div class="buttons">
    <button class="primary" onclick="sendSLX()">Отправить</button>
    <button onclick="faucet()">+100 SLX</button>
  </div>

  <section class="card">
    <h2>Network</h2>

    <div class="row">
      <span class="muted">Status</span>
      <span class="online">● Online</span>
    </div>

    <div class="row">
      <span class="muted">Network</span>
      <span>SLX Testnet</span>
    </div>

    <div class="row">
      <span class="muted">Version</span>
      <span>0.7</span>
    </div>
  </section>

  <section class="card">
    <h2>История</h2>
    <div id="history">
      <div class="empty">Загрузка...</div>
    </div>
  </section>

  <footer>
    SLX Network • Experimental Test Network
  </footer>

</div>

<script>
async function loadStatus() {
  try {
    const response = await fetch("/api/status");
    const data = await response.json();

    document.getElementById("balance").textContent =
      Number(data.balance).toFixed(2);

    document.getElementById("wallet").textContent =
      data.wallet;

    const history = document.getElementById("history");

    if (!data.transactions.length) {
      history.innerHTML =
        '<div class="empty">Транзакций пока нет</div>';
      return;
    }

    history.innerHTML = data.transactions.map(tx => `
      <div class="tx">
        ${tx.type === "send" ? "Отправлено" : "Получено"}
        <b>${Number(tx.amount).toFixed(2)} SLX</b>
        <br>
        <small class="muted">${tx.id}</small>
      </div>
    `).join("");

  } catch (error) {
    document.getElementById("history").innerHTML =
      '<div class="empty">Сервер пока недоступен</div>';
  }
}

async function sendSLX() {
  const amount = prompt("Сколько SLX отправить?");
  if (!amount) return;

  const recipient = prompt("Адрес получателя:");
  if (!recipient) return;

  try {
    const response = await fetch("/api/send", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        amount: Number(amount),
        recipient: recipient
      })
    });

    const data = await response.json();

    if (!data.success) {
      alert(data.error);
      return;
    }

    await loadStatus();
    alert("Транзакция создана!");

  } catch {
    alert("Сервер недоступен.");
  }
}

async function faucet() {
  try {
    const response = await fetch("/api/faucet", {
      method: "POST"
    });

    const data = await response.json();

    if (data.success) {
      await loadStatus();
      alert("Получено 100 тестовых SLX!");
    }

  } catch {
    alert("Сервер недоступен.");
  }
}

loadStatus();
</script>

</body>
</html>
